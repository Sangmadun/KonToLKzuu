name: Build Kernel & Tools (Automated Pipeline)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Select Build Target'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'kernel_only'
          - 'manager_only'
      ksu_fork:
        description: 'Select KernelSU Fork'
        required: true
        type: choice
        default: 'xxKSU'
        options:
          - 'xxKSU'
          - 'SUKISU'
          - 'ReSuKISU'
          - 'KSU-Next'
          - 'Official'
      manifest_name:
        description: 'Select Manifest XML Device'
        required: true
        type: choice
        options:
          - lineage
          - lotus-kernel
          - camellia
          - lotus-test
          - vortex-v1
          - vortex-test
          - cristidclxvi
      include_susfs:
        description: 'Include SUSFS (Kernel Anti-Detection)'
        required: true
        type: boolean
        default: true
      include_droidspace:
        description: 'Enable DroidSpace & OverlayFS (Mountify / Magic Mount)'
        required: true
        type: boolean
        default: true
      include_bbg:
        description: 'Include Baseband-Guard (BBG)'
        required: true
        type: boolean
        default: true
      include_lpud:
        description: 'Build LPUD Daemon Binary (For xxKSU / SUKISU)'
        required: true
        type: boolean
        default: true
      toolchain:
        description: 'Select Clang Toolchain'
        required: true
        type: choice
        default: 'proton-clang'
        options:
          - 'proton-clang'
          - 'aosp-clang'
          - 'zyc-clang'
          - 'azure-clang'
          - 'eva-gcc'

      # =========================================================================
      # INDIVIDUAL KERNEL-SIDE FEATURE TOGGLES
      # =========================================================================
      include_lto_o3:
        description: 'Enable ThinLTO & -O3 Compiler Optimizations'
        required: true
        type: boolean
        default: true
      include_wireguard:
        description: 'Inject WireGuard VPN Protocol'
        required: true
        type: boolean
        default: true
      include_f2fs:
        description: 'Inject F2FS Backport for 4.14'
        required: true
        type: boolean
        default: true
      include_zstd:
        description: 'Enable ZRAM ZSTD Compression'
        required: true
        type: boolean
        default: true
      include_bbr:
        description: 'Enable TCP BBR & Westwood Congestion Control'
        required: true
        type: boolean
        default: true
      include_ttl:
        description: 'Enable TTL / HL Packet Spoofing'
        required: true
        type: boolean
        default: true
        
permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: AUTOMATICALLY CALL WORKER KERNEL & MANAGER
  # -------------------------------------------------------------------------
  build-kernel-and-manager:
    uses: ./.github/workflows/build-kernel.yml
    with:
      build_target: ${{ inputs.build_target }}
      ksu_fork: ${{ inputs.ksu_fork }}
      manifest_name: ${{ inputs.manifest_name }}
      include_susfs: ${{ inputs.include_susfs }}
      include_droidspace: ${{ inputs.include_droidspace }}
      include_bbg: ${{ inputs.include_bbg }}
      toolchain: ${{ inputs.toolchain }}
      include_lto_o3: ${{ inputs.include_lto_o3 }}
      include_wireguard: ${{ inputs.include_wireguard }}
      include_f2fs: ${{ inputs.include_f2fs }}
      include_zstd: ${{ inputs.include_zstd }}
      include_bbr: ${{ inputs.include_bbr }}
      include_ttl: ${{ inputs.include_ttl }}
    secrets: inherit

  # -------------------------------------------------------------------------
  # JOB 2: AUTOMATICALLY CALL LPUD WORKER
  # -------------------------------------------------------------------------
  build-lpud-binary:
    needs: build-kernel-and-manager
    if: inputs.include_lpud == true && (inputs.ksu_fork == 'xxKSU' || inputs.ksu_fork == 'SUKISU')
    uses: ./.github/workflows/build-lpud.yml
    with:
      ksu_fork: ${{ inputs.ksu_fork }}
      target_arch: 'aarch64-linux-android'
    secrets: inherit
    
