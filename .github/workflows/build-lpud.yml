name: Build lpud Binary

on:
  workflow_dispatch:
    inputs:
      ksu_fork:
        description: 'Pilih Fork KernelSU'
        required: true
        type: choice
        default: 'xxKSU'
        options:
          - 'xxKSU'
          - 'SUKISU'
          - 'ReSuKISU'
      target_arch:
        description: 'Target Arsitektur'
        required: true
        type: choice
        default: 'aarch64-linux-android'
        options:
          - 'aarch64-linux-android'

  workflow_call:
    inputs:
      ksu_fork:
        required: true
        type: string
      target_arch:
        required: false
        type: string
        default: 'aarch64-linux-android'

permissions:
  contents: write

jobs:
  build-lpud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TARGET_ARCH: ${{ inputs.target_arch || 'aarch64-linux-android' }}

    steps:
      - name: Validate KSU Fork Input
        run: |
          case "${{ inputs.ksu_fork }}" in
            xxKSU|SUKISU|ReSuKISU) ;;
            *)
              echo "::error::ksu_fork tidak dikenali: '${{ inputs.ksu_fork }}'. Harus salah satu dari: xxKSU, SUKISU, ReSuKISU"
              exit 1
              ;;
          esac

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_ARCH }}

      - name: Cache Cargo Registry & cross Binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cross
          key: cargo-cross-${{ runner.os }}-66845c1

      - name: Clone KSU Userspace Source
        run: |
          rm -rf ksu-src

          case "${{ inputs.ksu_fork }}" in
            xxKSU)
              REPO_URL="https://github.com/backslashxx/KernelSU.git"
              ;;
            ReSuKISU)
              REPO_URL="https://github.com/rsuntk/ReSuKISU.git"
              ;;
            SUKISU)
              REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
              ;;
          esac

          echo "Cloning ${{ inputs.ksu_fork }} Userspace from $REPO_URL ..."
          git clone --depth=1 "$REPO_URL" ksu-src

      - name: Setup Cross Compiler
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1 --force
          else
            echo "cross sudah tersedia dari cache, skip install."
          fi

      - name: Build lpud / ksud
        run: |
          cd ksu-src

          # Cari lokasi Cargo.toml (lpud atau ksud) secara otomatis
          CARGO_PATH=$(find . -maxdepth 3 -name "Cargo.toml" | grep -E "lpud|ksud" | head -n 1)

          if [ -z "$CARGO_PATH" ]; then
            # Fallback jika tidak terdeteksi spesifik, cari Cargo.toml apa saja di folder userspace
            CARGO_PATH=$(find userspace -name "Cargo.toml" 2>/dev/null | head -n 1)
          fi

          if [ -z "$CARGO_PATH" ]; then
            echo "::error::Cargo.toml untuk lpud/ksud tidak ditemukan di fork '${{ inputs.ksu_fork }}'!"
            echo "Isi struktur repositori:"
            ls -la
            exit 1
          fi

          echo "Menemukan project Rust di lokasi: $CARGO_PATH"

          CROSS_NO_WARNINGS=0 cross build --target "$TARGET_ARCH" --release --manifest-path "$CARGO_PATH"

          mkdir -p ../output_lpud

          # Cari binary hasil kompilasi (lpud atau ksud)
          BINARY_FILE=$(find "target/$TARGET_ARCH/release/" -maxdepth 1 -type f \( -name "lpud*" -o -name "ksud*" \) ! -name "*.d" | head -n 1)

          if [ -z "$BINARY_FILE" ]; then
            echo "::error::Binary hasil kompilasi tidak ditemukan di folder target!"
            exit 1
          fi

          echo "Berhasil mem-build: $BINARY_FILE"
          cp "$BINARY_FILE" "../output_lpud/lpud-${TARGET_ARCH}"

      - name: Upload lpud Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpud-${{ inputs.ksu_fork }}-${{ env.TARGET_ARCH }}
          path: output_lpud/lpud-${{ env.TARGET_ARCH }}

      - name: Publish to GitHub Release (Manual Execution)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lpud-${{ inputs.ksu_fork }}-${{ github.run_number }}
          name: "lpud Binary - ${{ inputs.ksu_fork }} (#${{ github.run_number }})"
          body: |
            ### 🛠️ lpud Binary Release
            - **KSU Fork**: `${{ inputs.ksu_fork }}`
            - **Architecture**: `${{ env.TARGET_ARCH }}`
          files: |
            output_lpud/lpud-${{ env.TARGET_ARCH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
