name: "Setup KSU Fork"
description: "Prepare and setup KernelSU/ReSukiSU fork source"
inputs:
  ksu_fork:
    description: "Selected KernelSU fork engine"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup KernelSU Source
      shell: bash
      run: |
        cd kernel-source

        FORK="${{ inputs.ksu_fork }}"
        echo "⚙️ Processing KSU Fork: $FORK"

        case "$FORK" in
          "xxKSU")
            REPO="https://github.com/backslashxx/KernelSU.git"
            BRANCH="main"
            ;;
          "SUKISU")
            REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
            BRANCH="main"
            ;;
          "ReSuKISU"|"ReSukiSU")
            REPO="https://github.com/ReSukiSU/ReSukiSU.git"
            BRANCH="main"
            ;;
          "KSU-Next")
            REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
            BRANCH="dev"
            ;;
          *)
            REPO="https://github.com/tiann/KernelSU.git"
            BRANCH="main"
            ;;
        esac

        echo "🧹 Cleaning previous drivers/kernelsu and temp folders..."
        rm -rf drivers/kernelsu KernelSU KernelSU_temp

        echo "📥 Cloning $FORK ($REPO - branch $BRANCH)..."
        if ! git clone --depth=1 -b "$BRANCH" "$REPO" KernelSU_temp 2>/dev/null; then
          echo "⚠️ Branch $BRANCH not found, attempting default branch..."
          git clone --depth=1 "$REPO" KernelSU_temp
        fi

        mkdir -p drivers/kernelsu

        if [ -d "KernelSU_temp/kernel" ]; then
          echo "🚚 Linking KSU source from KernelSU_temp/kernel to drivers/kernelsu..."
          rm -rf drivers/kernelsu
          ln -s ../KernelSU_temp/kernel drivers/kernelsu
        elif [ -f "KernelSU_temp/Makefile" ]; then
          echo "🚚 Linking KSU source from KernelSU_temp to drivers/kernelsu..."
          rm -rf drivers/kernelsu
          ln -s ../KernelSU_temp drivers/kernelsu
        else
          echo "❌ ERROR: No valid Makefile found in cloned KSU repository!"
          exit 1
        fi
        test -L drivers/kernelsu
        test -e drivers/kernelsu/../.git || { echo "::error::ReSukiSU Git context missing"; exit 1; }
        KSU_PINNED_COMMIT="$(git -C KernelSU_temp rev-parse HEAD)"
        test -n "$KSU_PINNED_COMMIT"
        echo "ReSukiSU source commit: $KSU_PINNED_COMMIT"

        # Sinkronisasi folder UAPI & injeksi include path
        echo "🔧 Fixing KSU UAPI header directories & includes..."
        mkdir -p drivers/kernelsu/uapi
        mkdir -p drivers/kernelsu/policy/uapi
        mkdir -p include/uapi

        find KernelSU_temp/ drivers/kernelsu/ -type d -name "uapi" 2>/dev/null | while read -r ufolder; do
          cp -rf "$ufolder"/* drivers/kernelsu/uapi/ 2>/dev/null || true
          cp -rf "$ufolder"/* drivers/kernelsu/policy/uapi/ 2>/dev/null || true
          cp -rf "$ufolder"/* include/uapi/ 2>/dev/null || true
        done

        # Pair the built-in kernel ABI with the official ReSukiSU Manager 35002.
        # Never inject the archived legacy 11872 ABI into a modern manager build.
        KSU_ABI_VERSION=35002
        if [ -f "drivers/kernelsu/Kbuild" ]; then
          sed -i '/-DKERNEL_SU_VERSION=/d' drivers/kernelsu/Kbuild
          sed -i "1iccflags-y += -I\$(srctree)/drivers/kernelsu -I\$(srctree)/drivers/kernelsu/include -DKERNEL_SU_VERSION=$KSU_ABI_VERSION" drivers/kernelsu/Kbuild
          sed -i -E "s/^[[:space:]]*KSU_VERSION[[:space:]]*:=.*/KSU_VERSION := $KSU_ABI_VERSION/" drivers/kernelsu/Kbuild
          printf '%s\n' "ccflags-y += -DKSU_VERSION=$KSU_ABI_VERSION -DKERNEL_SU_VERSION=$KSU_ABI_VERSION" >> drivers/kernelsu/Kbuild
          grep -q "KSU_VERSION := $KSU_ABI_VERSION" drivers/kernelsu/Kbuild
          grep -q -- "-DKSU_VERSION=$KSU_ABI_VERSION" drivers/kernelsu/Kbuild
        fi
        if [ -f "drivers/kernelsu/Makefile" ]; then
          sed -i '/-DKERNEL_SU_VERSION=/d' drivers/kernelsu/Makefile
          sed -i "1iccflags-y += -I\$(srctree)/drivers/kernelsu -I\$(srctree)/drivers/kernelsu/include -DKERNEL_SU_VERSION=$KSU_ABI_VERSION" drivers/kernelsu/Makefile
          sed -i -E "s/^[[:space:]]*KSU_VERSION[[:space:]]*:=.*/KSU_VERSION := $KSU_ABI_VERSION/" drivers/kernelsu/Makefile
        fi
        if grep -R -nE 'KERNEL_SU_VERSION[[:space:]]*(=| )+11872|-DKERNEL_SU_VERSION=11872' drivers/kernelsu; then
          echo '::error::legacy KSU ABI 11872 remains'
          exit 1
        fi

        # Preserve ReSukiSU's upstream mutually-exclusive hooking choice.
        # This target is pure SUSFS Inline: CONFIG_KSU_SUSFS is selected later,
        # while Manual and Tracepoint stay disabled. Never rewrite the Kconfig
        # into the old dual-hook layout or alter its runtime branch ordering.
        KSU_KCONFIG="drivers/kernelsu/Kconfig"
        grep -q 'prompt "KernelSU Hooking Method"' "$KSU_KCONFIG"
        grep -q '^choice$' "$KSU_KCONFIG"
        grep -q '^endchoice$' "$KSU_KCONFIG"
        grep -q '^config KSU_MANUAL_HOOK$' "$KSU_KCONFIG"
        grep -q '^config KSU_SUSFS$' "$KSU_KCONFIG"
        KSUD_RUNTIME="drivers/kernelsu/runtime/ksud_integration.c"
        grep -q '^#elif defined(CONFIG_KSU_SUSFS)$' "$KSUD_RUNTIME"
        ! grep -q 'CONFIG_KSU_SUSFS) && !defined(CONFIG_KSU_MANUAL_HOOK)' "$KSUD_RUNTIME"

        # Embed an ASCII ABI marker in the built-in KSU core. The dispatch object
        # is not guaranteed to be linked on every legacy config; core/init.c is.
        CORE_INIT="drivers/kernelsu/core/init.c"
        if [ -f "$CORE_INIT" ] && ! grep -q 'resukisu_kernel_abi_35002' "$CORE_INIT"; then
          sed -i '1i__attribute__((used, section(".rodata"))) static const char resukisu_kernel_abi_35002[] = "ReSukiSU-KERNEL-ABI-35002";' "$CORE_INIT"
        fi
        grep -q 'ReSukiSU-KERNEL-ABI-35002' "$CORE_INIT"

        # Injeksi ksu_cred secara presisi
        echo "🔧 Injecting extern ksu_cred declaration safely into KernelSU C files..."
        find drivers/kernelsu/ -type f -name "*.c" | while read -r file; do
          if grep -q "ksu_cred" "$file" && ! grep -q "struct cred \*ksu_cred" "$file" && ! grep -q "extern.*ksu_cred" "$file"; then
            echo "  -> Injecting ksu_cred declaration into $file"
            sed -i '1istruct cred;\nextern struct cred *ksu_cred;' "$file"
          fi
        done

        # Fix spesifik untuk selinux_hide.c
        SELINUX_HIDE_FILE="drivers/kernelsu/feature/selinux_hide.c"
        if [ -f "$SELINUX_HIDE_FILE" ]; then
          echo "🔧 Patching missing SELinux identifiers in $SELINUX_HIDE_FILE..."
          sed -i '1i#include <linux/types.h>\nstruct policydb;\nstruct sidtab;\nextern struct policydb *backup_policydb;\nextern struct sidtab *backup_sidtab;\nextern bool ksu_late_loaded;' "$SELINUX_HIDE_FILE"

          if ! grep -q "^struct policydb \*backup_policydb" "$SELINUX_HIDE_FILE" && ! grep -rq "struct policydb \*backup_policydb" drivers/kernelsu/selinux/ 2>/dev/null; then
            echo "struct policydb *backup_policydb = NULL;" >> "$SELINUX_HIDE_FILE"
            echo "struct sidtab *backup_sidtab = NULL;" >> "$SELINUX_HIDE_FILE"
          fi

          if ! grep -rq "ksu_late_loaded" drivers/kernelsu/core/ 2>/dev/null; then
            echo "bool ksu_late_loaded = false;" >> "$SELINUX_HIDE_FILE"
          fi
        fi

        # Fix spesifik untuk ksud_integration.c
        KSUD_FILE="drivers/kernelsu/runtime/ksud_integration.c"
        if [ -f "$KSUD_FILE" ]; then
          echo "🔧 Patching missing runtime identifiers in $KSUD_FILE..."
          # Recovery only stages ksud. Install must run inside Android's
          # post-fs-data SELinux context, after /data and policy are ready.
          python3 "$GITHUB_WORKSPACE/.github/scripts/add_ksud_install_rc.py" "$KSUD_FILE"
          grep -Fq '/data/adb/ksu-bootstrap/ksud' "$KSUD_FILE" || {
            echo "::error::ksud bootstrap executable path missing"; exit 1;
          }
          grep -Fq 'install --libadbroot /data/adb/ksu-bootstrap/libadbroot.so' "$KSUD_FILE" || {
            echo "::error::ksud install argument missing"; exit 1;
          }
          grep -Fq '/data/adb/ksu-bootstrap/bootstrap-meta.sh' "$KSUD_FILE" || {
            echo "::error::metamodule bootstrap command missing"; exit 1;
          }
          echo "✅ ksud and metamodule install are scheduled in Android post-fs-data"

          sed -i '1i#include <linux/types.h>\nextern bool ksu_no_custom_rc;\nextern bool ksu_late_loaded;' "$KSUD_FILE"

          if ! grep -rq "bool ksu_no_custom_rc" drivers/kernelsu/ 2>/dev/null; then
            echo "bool ksu_no_custom_rc = false;" >> "$KSUD_FILE"
          fi
          if ! grep -rq "bool ksu_late_loaded" drivers/kernelsu/ 2>/dev/null; then
            echo "bool ksu_late_loaded = false;" >> "$KSUD_FILE"
          fi
        fi

        # Fix spesifik untuk supercall/supercall.c (SUSFS_MAGIC)
        SUPERCALL_FILE="drivers/kernelsu/supercall/supercall.c"
        if [ -f "$SUPERCALL_FILE" ]; then
          echo "🔧 Direct patching SUSFS_MAGIC into $SUPERCALL_FILE..."
          sed -i '1i#include <linux/types.h>\n#include <linux/susfs_def.h>\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0xA5A5A5A5\n#endif' "$SUPERCALL_FILE"
        fi

        # Injeksi makro CMD_SUSFS_* ke dispatch.c. Weak stubs DIHAPUS:
        # dulu perlu karena susfs core absen, tapi sekarang SUSFS v2.2.0 core
        # LENGKAP (fs/susfs.c + susfs_def.h static-inline), jadi weak stub malah
        # bentrok ("static declaration follows non-static declaration").
        DISPATCH_FILE="drivers/kernelsu/supercall/dispatch.c"
        if [ -f "$DISPATCH_FILE" ]; then
          echo "🔧 Injecting CMD_SUSFS macros only (no weak stubs; core provides symbols)..."
          sed -i '1i__attribute__((used, section(".rodata"))) static const unsigned int resukisu_kernel_abi_version = 35002;\n#include <linux/types.h>\n#include <linux/susfs_def.h>\n#ifndef KERNEL_SU_VERSION\n#define KERNEL_SU_VERSION 35002\n#endif\nextern bool ksu_late_loaded;\n#ifndef CMD_SUSFS_ADD_SUS_PATH\n#define CMD_SUSFS_ADD_SUS_PATH 0x55555\n#define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55556\n#define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x55557\n#define CMD_SUSFS_ADD_SUS_KSTAT 0x55558\n#define CMD_SUSFS_UPDATE_SUS_KSTAT 0x55559\n#define CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY 0x5555a\n#define CMD_SUSFS_SET_UNAME 0x5555b\n#define CMD_SUSFS_ENABLE_LOG 0x5555c\n#define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x5555d\n#define CMD_SUSFS_ADD_OPEN_REDIRECT 0x5555e\n#define CMD_SUSFS_ADD_SUS_MAP 0x5555f\n#define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x55560\n#define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x55561\n#define CMD_SUSFS_SHOW_VARIANT 0x55562\n#define CMD_SUSFS_SHOW_VERSION 0x55563\n#endif' "$DISPATCH_FILE"
        fi

        # Generasi susfs_def.h global
        echo "🔧 Generating global susfs_def.h header..."
        mkdir -p include/linux
        mkdir -p drivers/kernelsu/include/linux

        printf '%s\n' \
          '#ifndef _SUSFS_DEF_H' \
          '#define _SUSFS_DEF_H' \
          '' \
          '#include <linux/types.h>' \
          '' \
          '#ifndef SUSFS_MAGIC' \
          '#define SUSFS_MAGIC 0xA5A5A5A5' \
          '#endif' \
          '' \
          '#ifndef TASK_STRUCT_NON_ROOT_USER_APP_PROC' \
          '#define TASK_STRUCT_NON_ROOT_USER_APP_PROC (1 << 0)' \
          '#endif' \
          '#ifndef INODE_STATE_SUS_KSTAT' \
          '#define INODE_STATE_SUS_KSTAT (1 << 0)' \
          '#endif' \
          '#ifndef INODE_STATE_SUS_PATH' \
          '#define INODE_STATE_SUS_PATH (1 << 1)' \
          '#endif' \
          '#ifndef INODE_STATE_SUS_MOUNT' \
          '#define INODE_STATE_SUS_MOUNT (1 << 2)' \
          '#endif' \
          '#ifndef INODE_STATE_OPEN_REDIRECT' \
          '#define INODE_STATE_OPEN_REDIRECT (1 << 3)' \
          '#endif' \
          '' \
          '#ifndef DEFAULT_SUS_MNT_ID' \
          '#define DEFAULT_SUS_MNT_ID 100000' \
          '#endif' \
          '#ifndef DEFAULT_SUS_MNT_GROUP_ID' \
          '#define DEFAULT_SUS_MNT_GROUP_ID 100000' \
          '#endif' \
          '#ifndef DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE' \
          '#define DEFAULT_SUS_MNT_ID_FOR_KSU_PROC_UNSHARE 99999' \
          '#endif' \
          '' \
          '#ifndef CMD_SUSFS_ADD_SUS_PATH' \
          '#define CMD_SUSFS_ADD_SUS_PATH 0x55555' \
          '#define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55556' \
          '#define CMD_SUSFS_HIDE_SUS_MNTS_FOR_NON_SU_PROCS 0x55557' \
          '#define CMD_SUSFS_ADD_SUS_KSTAT 0x55558' \
          '#define CMD_SUSFS_UPDATE_SUS_KSTAT 0x55559' \
          '#define CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY 0x5555a' \
          '#define CMD_SUSFS_SET_UNAME 0x5555b' \
          '#define CMD_SUSFS_ENABLE_LOG 0x5555c' \
          '#define CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG 0x5555d' \
          '#define CMD_SUSFS_ADD_OPEN_REDIRECT 0x5555e' \
          '#define CMD_SUSFS_ADD_SUS_MAP 0x5555f' \
          '#define CMD_SUSFS_ENABLE_AVC_LOG_SPOOFING 0x55560' \
          '#define CMD_SUSFS_SHOW_ENABLED_FEATURES 0x55561' \
          '#define CMD_SUSFS_SHOW_VARIANT 0x55562' \
          '#define CMD_SUSFS_SHOW_VERSION 0x55563' \
          '#endif' \
          '' \
          '#endif /* _SUSFS_DEF_H */' > include/linux/susfs_def.h

        cp -f include/linux/susfs_def.h drivers/kernelsu/include/linux/susfs_def.h 2>/dev/null || true

        # Keep KernelSU_temp: drivers/kernelsu is a symlink into this clone so
        # upstream Git/version and fail-closed Kbuild checks remain valid.
        test -e KernelSU_temp/.git
        test -f drivers/kernelsu/Kbuild

        sed -i 's|source "KernelSU/Kconfig"|source "drivers/kernelsu/Kconfig"|g' drivers/Kconfig
        sed -i 's|source "drivers/KernelSU/Kconfig"|source "drivers/kernelsu/Kconfig"|g' drivers/Kconfig

        if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
        fi

        if ! grep -q "kernelsu" drivers/Makefile; then
          echo 'obj-y += kernelsu/' >> drivers/Makefile
        fi

        echo "🔒 Preserving upstream fail-closed Kbuild validators..."
        ! grep -R -nF '$(info You should integrate' drivers/kernelsu/tools drivers/kernelsu/Kbuild 2>/dev/null || {
          echo "::error::KernelSU validators were weakened"; exit 1;
        }
        grep -qF '$(error You should integrate' drivers/kernelsu/tools/inline_hook_check.mk || {
          echo "::error::inline hook validator is not fail-closed"; exit 1;
        }

        echo "✅ Verification of drivers/kernelsu directory:"
        ls -la drivers/kernelsu/
        
