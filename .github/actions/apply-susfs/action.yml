name: "Apply SUSFS Patch & Configs"
description: "Apply SUSFS v2.2.0 (sidex15/FlopKernel backport, base 4.14.357-openela) for camellia. Drop-in core + VFS hook patch + IDA compat shim. FTS FT8722 preserved."

runs:
  using: "composite"
  steps:
    - name: Apply SUSFS v2.2.0
      shell: bash
      run: |
        set -e
        ACT_DIR="$GITHUB_WORKSPACE/patches/susfs_v220"
        cd kernel-source
        echo "==============================================="
        echo " SUSFS v2.2.0 integration (camellia 4.14.357)"
        echo "==============================================="

        # ---------------------------------------------------------------
        # 1. Drop-in SUSFS v2.2.0 core files (NOT simonpunk 1.5.5 anymore).
        #    Base kernel of these files = 4.14.357-openela, identical to camellia,
        #    so they are ABI-compatible drop-ins.
        # ---------------------------------------------------------------
        echo "[1] Installing SUSFS v2.2.0 core files..."
        mkdir -p include/linux
        cp -f "$ACT_DIR/susfs.c"      fs/susfs.c
        cp -f "$ACT_DIR/susfs.h"      include/linux/susfs.h
        cp -f "$ACT_DIR/susfs_def.h"  include/linux/susfs_def.h
        echo "    SUSFS_VERSION: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)"

        # ---------------------------------------------------------------
        # 2. IDA compat shim: SUSFS v2.2.0 hook code uses the modern IDR API
        #    (ida_alloc_min / ida_free) which 4.14 does NOT provide. camellia
        #    only ships ida_get_new_above / ida_remove / ida_simple_*. Provide
        #    static-inline shims so the new call-sites compile on 4.14.
        #    Guarded so it is a no-op on kernels that already have the new API.
        # ---------------------------------------------------------------
        echo "[2] Injecting IDA compat shim for 4.14..."
        SHIM='include/linux/susfs_ida_compat.h'
        cat > "$SHIM" <<'SHIMEOF'
        #ifndef _SUSFS_IDA_COMPAT_H
        #define _SUSFS_IDA_COMPAT_H
        #include <linux/version.h>
        #include <linux/idr.h>
        #include <linux/gfp.h>
        /*
         * 4.14 lacks ida_alloc_min()/ida_free(). Provide shims backed by the
         * legacy ida_simple_get()/ida_simple_remove() API that 4.14 ships.
         * Only defined when the modern API is absent (pre-4.19 behaviour).
         */
        #if LINUX_VERSION_CODE < KERNEL_VERSION(4,19,0)
        #ifndef SUSFS_HAVE_IDA_ALLOC_MIN
        #define SUSFS_HAVE_IDA_ALLOC_MIN
        static inline int ida_alloc_min(struct ida *ida, unsigned int min, gfp_t gfp)
        {
        	return ida_simple_get(ida, min, 0, gfp);
        }
        static inline void ida_free(struct ida *ida, unsigned int id)
        {
        	ida_simple_remove(ida, id);
        }
        #endif /* SUSFS_HAVE_IDA_ALLOC_MIN */
        #endif /* < 4.19 */
        #endif /* _SUSFS_IDA_COMPAT_H */
        SHIMEOF
        # de-indent heredoc (leading 8 spaces from YAML block)
        sed -i 's/^        //' "$SHIM"
        echo "    shim written: $SHIM"

        # Make susfs.h pull the shim first (so all hook TUs see ida_alloc_min).
        if ! grep -q "susfs_ida_compat.h" include/linux/susfs.h; then
          sed -i '1i#include <linux/susfs_ida_compat.h>' include/linux/susfs.h
        fi
        # namespace.c is the VFS TU that actually calls ida_alloc_min/ida_free.
        if ! grep -q "susfs_ida_compat.h" fs/namespace.c; then
          sed -i '1i#include <linux/susfs_ida_compat.h>' fs/namespace.c
        fi

        # ---------------------------------------------------------------
        # 3. Apply the VFS hook call-site patch (v2.0.0 base; call-sites are
        #    stable through 2.2.0). Fuzz-tolerant. Rejects in KSU_MANUAL_HOOK
        #    guard blocks are HARMLESS on this base (ReSukiSU uses inline hooks),
        #    but any reject touching susfs core is surfaced and fails the build.
        # ---------------------------------------------------------------
        echo "[3] Applying VFS hook patch (fuzz-tolerant)..."
        patch -p1 --fuzz=3 --no-backup-if-mismatch < "$ACT_DIR/10_vfs_hooks.patch" || true

        echo "[3a] Reviewing rejects..."
        REJECTS=$(find . -name '*.rej' 2>/dev/null || true)
        FATAL=0
        if [ -n "$REJECTS" ]; then
          for r in $REJECTS; do
            echo "    --- reject: $r ---"
            # A reject is FATAL only if it touches a susfs_* core symbol
            # (sus_path/kstat/mount/map/umount). Pure KSU_MANUAL_HOOK guard
            # rejects are expected on this base and are non-fatal.
            if grep -qE 'susfs_(add|update|mark|run|handle|get|set|alloc|spoof|is_|hide|try_umount)' "$r"; then
              echo "    !! FATAL: reject touches susfs core in $r"
              cat "$r"
              FATAL=1
            else
              echo "    ok: harmless KSU-hook-guard reject (skipping)"
            fi
          done
        fi
        if [ "$FATAL" = "1" ]; then
          echo "::error::SUSFS core hunk failed to apply. Manual port needed."
          exit 1
        fi
        # clean up harmless reject/orig files
        find . -name '*.rej' -delete 2>/dev/null || true
        find . -name '*.orig' -delete 2>/dev/null || true

        # ---------------------------------------------------------------
        # 4. fs/Makefile: ensure susfs.o is built.
        # ---------------------------------------------------------------
        if ! grep -q 'susfs.o' fs/Makefile; then
          echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          echo "[4] Added susfs.o to fs/Makefile"
        else
          echo "[4] susfs.o already in fs/Makefile"
        fi

        # ---------------------------------------------------------------
        # 5. Verification.
        # ---------------------------------------------------------------
        echo "[5] Verification:"
        ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h include/linux/susfs_ida_compat.h
        echo "    Version: $(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h)"
        echo "    fs/namespace.c ida calls: $(grep -cE 'ida_alloc_min|ida_free\(' fs/namespace.c)"
        echo "SUSFS v2.2.0 integration done."
