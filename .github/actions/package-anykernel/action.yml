name: "Package AnyKernel3"
description: "Package built kernel into AnyKernel3 zip archive and generate SHA256 checksum"
inputs:
  ksu_fork:
    description: "KernelSU engine used"
    required: false
    default: ""
  include_susfs:
    description: "Include SuSFS flag"
    required: false
    default: "false"
  include_bbg:
    description: "Include BBG flag"
    required: false
    default: "false"
  include_bbr:
    description: "Include BBR flag"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Package AnyKernel3 & Generate SHA256
      shell: bash
      run: |
        # Use the exact inner wrapper from the previously proven OrangeFox
        # release. A fresh upstream AnyKernel3 wrapper is NOT equivalent on
        # camellia/MTK Virtual A/B and can fail with OrangeFox ERROR: 1.
        set -euo pipefail
        OUT_DIR="${GITHUB_WORKSPACE}/kernel-source/out/arch/arm64/boot"
        test -s "${OUT_DIR}/Image.gz-dtb" || { echo "::error::Image.gz-dtb missing"; exit 1; }
        DONOR_URL="https://github.com/Sangmadun/KonToLKzuu/releases/download/v7-camellia-universal/LotusKernel-Camellia-v7-OrangeFox.zip"
        rm -rf AnyKernel3 .orangefox-donor
        mkdir -p .orangefox-donor
        curl -fL --retry 3 "$DONOR_URL" -o .orangefox-donor/donor.zip
        unzip -q .orangefox-donor/donor.zip -d .orangefox-donor/outer
        INNER=$(find .orangefox-donor/outer -maxdepth 1 -type f -name '*.zip' | head -1)
        test -s "$INNER" || { echo "::error::OrangeFox donor inner ZIP missing"; exit 1; }
        unzip -q "$INNER" -d AnyKernel3
        rm -f AnyKernel3/Image AnyKernel3/Image.gz AnyKernel3/Image.gz-dtb
        cp "${OUT_DIR}/Image.gz-dtb" AnyKernel3/Image.gz-dtb

        # Keep the donor's META-INF/update-binary and ak3-core byte-for-byte.
        # Only the kernel payload is replaced; this is the validated transplant.
        test -s AnyKernel3/tools/ak3-core.sh
        test -s AnyKernel3/META-INF/com/google/android/update-binary
        grep -q 'block=auto' AnyKernel3/anykernel.sh
        grep -q 'is_slot_device=auto' AnyKernel3/anykernel.sh

        KSU_NAME="${{ inputs.ksu_fork }}"
        [ -z "$KSU_NAME" ] && KSU_NAME="NoKSU"
        FEATURE_TAGS=""
        [ "${{ inputs.include_susfs }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-SUSFS"
        [ "${{ inputs.include_bbg }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBG"
        [ "${{ inputs.include_bbr }}" = "true" ] && FEATURE_TAGS="${FEATURE_TAGS}-BBR"

        # Do not add a second/nested ZIP or dtb_check payload to the flash ZIP.
        find AnyKernel3 -maxdepth 1 -type f -name '*.zip' -delete
        rm -rf AnyKernel3/dtb_check

        # Record the exact donor wrapper provenance for release auditing.
        printf '%s\n' "$DONOR_URL" > AnyKernel3/orangefox_wrapper_source.txt
        printf '%s\n' "$(sha256sum AnyKernel3/tools/ak3-core.sh)" > AnyKernel3/orangefox_ak3_core.sha256
        printf '%s\n' "$(sha256sum AnyKernel3/META-INF/com/google/android/update-binary)" > AnyKernel3/orangefox_update_binary.sha256

        # -----------------------------------------------------------------
        # BUILD ZIP & SHA256 DI ROOT WORKSPACE (..)
        # -----------------------------------------------------------------
        ZIP_NAME="LotusKernel-Camellia-${KSU_NAME}${FEATURE_TAGS}-$(date +%Y%m%d_%H%M).zip"
        echo "📦 Creating proven OrangeFox-compatible ZIP: ${ZIP_NAME}"
        cd AnyKernel3
        zip -r9 "../${ZIP_NAME}" . -x '.git/*' '*.zip' '*placeholder'
        cd ..
        sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
        echo "✅ Created SHA256 checksum: ${ZIP_NAME}.sha256"

        # -----------------------------------------------------------------
        # GENERATE CHANGELOG & COMMIT LINK
        # -----------------------------------------------------------------
        if [ -d "kernel-source" ]; then
          cd kernel-source
          git log -n 10 --pretty=format:"• %h - %s (%cr) <%an>" > ../changelog.txt 2>/dev/null || echo "• Lotus Kernel Build Release" > ../changelog.txt
          REMOTE_URL=$(git config --get remote.origin.url 2>/dev/null | sed 's/\.git$//' || true)
          HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || true)
          if [ -n "$REMOTE_URL" ] && [ -n "$HEAD_SHA" ]; then
            echo "${REMOTE_URL}/commit/${HEAD_SHA}" > ../commit_link.txt
          else
            echo "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" > ../commit_link.txt
          fi
          cd ..
        else
          echo "• Lotus Kernel Build Release" > changelog.txt
          echo "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" > commit_link.txt
        fi
        echo "✅ Generated changelog.txt & commit_link.txt"
        exit 0

        # Legacy generator retained below for history; unreachable by design.
        cat << 'EOF_AK3' > anykernel.sh
        # AnyKernel3 Ramdisk Mod Script for Xiaomi Camellia (MT6833)
        # osm0sis @ xda-developers

        ## AnyKernel setup
        properties() { '
        kernel.string=Lotus Kernel for Xiaomi Camellia
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=camellia
        device.name2=camellian
        supported.versions=
        supported.patchlevels=
        '; } # end properties

        ## AnyKernel install
        boot_attributes() {
        set_perm_recursive 0 0 755 644 $RAMDISK/*;
        set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
        } # end attributes

        # boot shell variables
        block=auto;
        is_slot_device=auto;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        # Import fungsi utama AnyKernel
        . tools/ak3-core.sh;

        # Fix O3BFD File Descriptor
        if [ -z "$O3BFD" ] || [ ! -e "/proc/self/fd/$O3BFD" ]; then
          for fd in 1 2 3 0; do
            if [ -e "/proc/self/fd/$fd" ]; then
              O3BFD=$fd;
              break;
            fi;
          done;
        fi;

        # Print Full Cyber ASCII Banner
        ui_print "==================================================";
        ui_print " #    ####  ##### #   #  ###   ### #  ####  #   # ";
        ui_print " #   #    #   #   #   # #     #    # #     # #  # ";
        ui_print " #   #    #   #   #   #  ###  #    ##      #  # # ";
        ui_print " #   #    #   #   #   #     # #    # #     #   ## ";
        ui_print " ###  ####    #    ###  ####   ### #  #### #    # ";
        ui_print "==================================================";
        ui_print "               LOTUS-KERNEL CUSTOM                ";
        ui_print "==================================================";
        ui_print " [>] Device   : Xiaomi Camellia (Redmi Note 10 5G)";
        ui_print " [>] Kernel   : Linux 4.14.x";
        ui_print "==================================================";

        sleep 2;

        split_boot;
        flash_boot;
        flash_dtbo;
        EOF_AK3

        # -----------------------------------------------------------------
        # BUILD ZIP & SHA256 DI ROOT WORKSPACE (..)
        # -----------------------------------------------------------------
        ZIP_NAME="LotusKernel-Camellia-${KSU_NAME}${FEATURE_TAGS}-$(date +%Y%m%d_%H%M).zip"
        
        echo "📦 Creating ZIP archive: ${ZIP_NAME}"
        zip -r9 "../${ZIP_NAME}" * -x .git README.md *placeholder

        cd ..
        sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
        echo "✅ Created SHA256 checksum: ${ZIP_NAME}.sha256"

        # -----------------------------------------------------------------
        # GENERATE CHANGELOG & COMMIT LINK (PERBAIKAN DENGAN FALLBACK)
        # -----------------------------------------------------------------
        if [ -d "kernel-source" ]; then
          cd kernel-source
          git log -n 10 --pretty=format:"• %h - %s (%cr) <%an>" > ../changelog.txt 2>/dev/null || echo "• Lotus Kernel Build Release" > ../changelog.txt
          
          REMOTE_URL=$(git config --get remote.origin.url 2>/dev/null | sed 's/\.git$//' || true)
          HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || true)

          if [ -n "$REMOTE_URL" ] && [ -n "$HEAD_SHA" ]; then
            echo "${REMOTE_URL}/commit/${HEAD_SHA}" > ../commit_link.txt
          else
            echo "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" > ../commit_link.txt
          fi
          cd ..
        else
          echo "• Lotus Kernel Build Release" > changelog.txt
          echo "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" > commit_link.txt
        fi
        echo "✅ Generated changelog.txt & commit_link.txt!"
